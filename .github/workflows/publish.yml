# Builds the site and publishes it to GitHub Pages on every change to main
# (including every save from Pages CMS), and every hour to refresh the timetable. Takes about a minute.
name: Publish site
on:
  push:
    branches: [main]
  schedule:
    - cron: '7 * * * *'   # every hour, so the timetable on the Train page stays current
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node build.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
