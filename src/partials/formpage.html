<section class="form-page">
  <div class="wrap form-grid">
    <aside class="form-aside">
      <h1 id="t">{{title}}</h1>
      <p class="lead">{{intro}}</p>
      <div class="form-photo"><img src="{{image}}" alt="{{image_alt}}"></div>
      <h2 class="points-title">{{points_title}}</h2>
      <ol class="points">{{#points}}<li>{{.}}</li>{{/points}}</ol>
    </aside>
    {{> formcard}}
  </div>
</section>
